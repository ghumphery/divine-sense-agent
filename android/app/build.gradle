// v0.9.125.9 — Divine Sense Agent launcher (app module)
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.divinesense.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.divinesense.agent"
        minSdk 24            // Android 7.0 — WebView covers the whole API
        targetSdk 34
        versionCode 1
        versionName "0.9.125.9"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // v0.9.126.2 — ZERO runtime dependencies (androidx/material removed):
    // the WebView ships with the platform, so assemble works both via
    // gradle and via the no-gradle android/build_apk.py.
}