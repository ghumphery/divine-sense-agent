[project]
name = "divine-sense-agent"
version = "0.9.133.18"
description = "Qdrant-powered MCP server for LLM to query local file contents (sibling of milvus-mcp-agent)"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.10.0",
    "openai>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "streamlit>=1.30.0",
    "pywebview>=5.0",
    # v0.9.2+: Pillow for the resize_image MCP tool — read +
    # downscale + preserve EXIF when re-saving.
    "Pillow>=10.0.0",
    # v0.9.125.6: PyMuPDF renders PDF pages to PNG for the handwriting
    # pad's 📄 匯入 PDF underlay flow (pypdf cannot rasterize pages).
    "pymupdf>=1.24.0",
    # v0.9.8+: py7zr for the archive MCP tools — 7z create/extract
    # (zip / tar / gz use the stdlib). Pure-Python, no system 7-Zip
    # binary required.
    "py7zr>=1.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["pytest>=8.0", "playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]
